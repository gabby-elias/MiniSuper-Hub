services:
  minisuper-hub:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://host.docker.internal:5432/MiniSuper-Hub"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME:?Define DB_USERNAME in the environment}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD in the environment}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
