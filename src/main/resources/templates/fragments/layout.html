<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, stylesheet)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Minisúper · ${title}|">Minisúper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/{file}.css(file=${stylesheet})}">
</head>
<body>
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg top-nav">
    <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand brand-mark" th:href="@{/dashboard}"><span class="brand-icon">🛒</span> Minisúper</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Abrir navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
            <ul class="navbar-nav me-auto ms-lg-3 gap-lg-1">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'dashboard'} ? ' active' : ''" th:href="@{/dashboard}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'categorias'} ? ' active' : ''" th:href="@{/categorias}">Categorías</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'productos'} ? ' active' : ''" th:href="@{/productos}">Productos</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'clientes'} ? ' active' : ''" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'facturas'} ? ' active' : ''" th:href="@{/facturas}">Facturas</a></li>
                <li class="nav-item" th:if="${esAdmin}"><a class="nav-link" th:classappend="${active == 'detalles'} ? ' active' : ''" th:href="@{/detalles-factura}">Detalles</a></li>
                <li class="nav-item" th:if="${esAdmin}"><a class="nav-link" th:classappend="${active == 'usuarios'} ? ' active' : ''" th:href="@{/usuarios}">Usuarios</a></li>
                <li class="nav-item" th:if="${esAdmin}"><a class="nav-link" th:classappend="${active == 'reportes'} ? ' active' : ''" th:href="@{/reportes}">Reportes</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3 py-2 py-lg-0">

                <span class="role-badge" th:text="${esAdmin ? 'Administrador' : 'Empleado'}">Administrador</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-sm btn-outline-light" type="submit">Salir</button>
                </form>
            </div>
        </div>
    </div>
</nav>
<th:block th:fragment="scripts">
    <div id="flash-alert" class="d-none" th:if="${alertMessage != null}" th:attr="data-type=${alertType},data-message=${alertMessage}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/alerts.js}"></script>
</th:block>
</body>
</html>
