<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<form th:fragment="formularioProducto(modal)" th:action="@{/productos/guardar}" th:object="${producto}" method="post"
      data-swal-confirm data-swal-action="save"
      data-swal-title="¿Guardar producto?"
      data-swal-text="Confirma para guardar los datos y existencias del producto."
      data-swal-confirm-text="Sí, guardar">
    <input type="hidden" th:field="*{id}">

    <div th:class="${modal ? 'modal-body' : ''}">
        <div class="form-field-group">
            <label for="nombre" class="form-label-custom">Nombre del producto</label>
            <input id="nombre" class="form-control-custom" type="text" th:field="*{nombre}" maxlength="150"
                   placeholder="Ej.: Coca Cola 600 ml" required autofocus>
        </div>

        <div class="form-field-group unit-measure-field">
            <span class="form-label-custom">Unidad de medida</span>
            <div class="unit-options" role="group" aria-label="Seleccionar unidad de medida">
                <button type="button" class="unit-choice" data-unit-option data-unit-value="Unidad" aria-pressed="false">Unidad</button>
                <button type="button" class="unit-choice" data-unit-option data-unit-value="Kg" aria-pressed="false">Kg</button>
                <button type="button" class="unit-choice" data-unit-option data-unit-value="Libra" aria-pressed="false">Libra</button>
                <button type="button" class="unit-choice" data-unit-option data-unit-value="Litro" aria-pressed="false">Litro</button>
                <button type="button" class="unit-choice" data-unit-option data-unit-value="Paquete" aria-pressed="false">Paquete</button>
                <button type="button" class="unit-choice" data-unit-option data-unit-value="Caja" aria-pressed="false">Caja</button>
                <button type="button" class="unit-choice" data-unit-option data-unit-value="__custom__" aria-pressed="false">+ Otra</button>
            </div>
            <input id="unidadMedida" class="form-control-custom unit-custom-input" type="text"
                   th:field="*{unidadMedida}" maxlength="50" placeholder="Especifica la unidad de medida"
                   aria-label="Otra unidad de medida" hidden>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
                <label for="stock" class="form-label-custom">Existencias (<span id="stockUnitLabel" th:text="${#strings.isEmpty(producto.unidadMedida) ? 'unidad' : producto.unidadMedida}">unidad</span>)</label>
                <div class="stock-stepper-box">
                    <button type="button" class="stepper-btn" id="btnStockMinus" aria-label="Disminuir existencias">−</button>
                    <input id="stock" class="stepper-input" type="number" min="0" step="1" th:field="*{stock}" required>
                    <button type="button" class="stepper-btn" id="btnStockPlus" aria-label="Aumentar existencias">+</button>
                </div>
                <div class="quick-add-container">
                    <span class="quick-add-label">Agregar:</span>
                    <button type="button" class="quick-add-pill" data-add="5">+5</button>
                    <button type="button" class="quick-add-pill" data-add="10">+10</button>
                    <button type="button" class="quick-add-pill" data-add="20">+20</button>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <label for="precioVenta" class="form-label-custom">Precio de venta por <span id="priceUnitLabel" th:text="${#strings.isEmpty(producto.unidadMedida) ? 'unidad' : producto.unidadMedida}">unidad</span></label>
                <div class="price-stepper-box">
                    <button type="button" class="stepper-btn" data-price-step="-1" aria-label="Disminuir precio">−</button>
                    <div class="price-input-group">
                        <span class="price-prefix">$</span>
                        <input id="precioVenta" class="price-input" type="number" step="0.01" min="0"
                               th:field="*{precioVenta}" placeholder="0.00" required>
                    </div>
                    <button type="button" class="stepper-btn" data-price-step="1" aria-label="Aumentar precio">+</button>
                </div>
                <div class="quick-add-container price-quick-add-container">
                    <span class="quick-add-label">Sumar:</span>
                    <button type="button" class="quick-add-pill price-quick-add-pill" data-price-add="0.25">+0.25</button>
                    <button type="button" class="quick-add-pill price-quick-add-pill" data-price-add="0.50">+0.50</button>
                    <button type="button" class="quick-add-pill price-quick-add-pill" data-price-add="1.00">+1.00</button>
                </div>
            </div>
        </div>

        <div class="form-field-group">
            <label for="categoria" class="form-label-custom">Categoría</label>
            <select id="categoria" name="categoria.id" class="form-select-custom" required>
                <option value="">Selecciona una categoría</option>
                <option th:each="categoria : ${categorias}"
                        th:value="${categoria.id}"
                        th:text="${categoria.nombreCategoria}"
                        th:selected="${producto.categoria != null and producto.categoria.id == categoria.id}">
                </option>
            </select>
            <div class="text-danger small mt-1" th:if="${#lists.isEmpty(categorias)}">
                Primero debes registrar al menos una categoría.
            </div>
        </div>

        <div class="product-form-preview" role="status" aria-live="polite">
            <svg class="product-preview-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span>
                <strong id="productPreviewName" th:text="${#strings.isEmpty(producto.nombre) ? 'Producto' : producto.nombre}">Producto</strong>
                · <span id="productPreviewStock" th:text="${producto.stock}">0</span>
                <span id="productPreviewUnit" th:text="${#strings.isEmpty(producto.unidadMedida) ? 'unidad' : producto.unidadMedida}">unidad</span> en stock
                · <strong id="productPreviewPrice" th:text="|$${#numbers.formatDecimal(producto.precioVenta, 1, 2)}|">$0.00</strong>
                por <span id="productPreviewPriceUnit" th:text="${#strings.isEmpty(producto.unidadMedida) ? 'unidad' : producto.unidadMedida}">unidad</span>
            </span>
        </div>
    </div>

    <div class="product-form-actions" th:classappend="${modal ? ' modal-footer' : ''}">
        <button th:if="${modal}" class="btn-form-cancel" type="button" data-bs-dismiss="modal">Cancelar</button>
        <a th:unless="${modal}" class="btn-form-cancel" th:href="@{/productos}">Cancelar</a>
        <button class="btn-form-submit" type="submit" th:text="${producto.id == 0 ? 'Guardar producto' : 'Guardar cambios'}">
            Guardar producto
        </button>
    </div>
</form>
</body>
</html>
