<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios', 'usuarios-lista')}"></head>
<body class="app-page">
<nav th:replace="~{fragments/layout :: navbar('usuarios')}"></nav>
<main class="app-main">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 page-heading">
        <div><h1>Usuarios</h1><p>Administra las cuentas y sus permisos de acceso.</p></div>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">＋ Nuevo usuario</a>
    </div>
    <section class="content-card table-responsive">
        <table class="table table-hover align-middle">
            <thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.username}"></td>
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.rol}"></td>
                <td><span class="badge" th:classappend="${usuario.activo} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${usuario.activo} ? 'Activo' : 'Inactivo'"></span></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-light" th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">Editar</a>
                    <form th:if="${usuario.activo}" class="d-inline" th:action="@{/usuarios/{id}/desactivar(id=${usuario.id})}" method="post" data-swal-confirm data-swal-action="delete" data-swal-title="¿Desactivar usuario?" data-swal-text="El usuario ya no podrá iniciar sesión.">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Desactivar</button>
                    </form>
                    <form th:unless="${usuario.activo}" class="d-inline" th:action="@{/usuarios/{id}/activar(id=${usuario.id})}" method="post">
                        <button class="btn btn-sm btn-outline-success" type="submit">Activar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="5" class="text-center text-secondary py-5">No hay usuarios registrados.</td></tr>
            </tbody>
        </table>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
