<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios', 'usuarios-lista')}"></head>
<body class="app-page user-page">
<nav th:replace="~{fragments/layout :: navbar('usuarios')}"></nav>
<main class="app-main">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 page-heading">
        <div>
            <h1>Usuarios</h1>
            <p>Gestiona los accesos al sistema.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">+ Nuevo usuario</a>
    </div>
    <section class="content-card">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th style="width: 60px;">N.°</th>
                    <th>Nombre</th>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th class="text-end" style="width: 220px;">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td class="text-secondary" th:text="${usuario.id}">1</td>
                    <td>
                        <div class="d-inline-flex align-items-center">
                            <span class="user-avatar-badge" th:text="${#strings.substring(usuario.nombre, 0, 1).toUpperCase()}">A</span>
                            <strong th:text="${usuario.nombre}">Administradora</strong>
                        </div>
                    </td>
                    <td th:text="${usuario.username}">admin</td>
                    <td th:text="${usuario.rol}">Administrador</td>
                    <td>
                        <span class="badge-state" th:classappend="${usuario.activo ? 'badge-active' : 'badge-inactive'}" th:text="${usuario.activo ? 'Activo' : 'Inactivo'}">Activo</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <div class="d-inline-flex align-items-center gap-1">
                            <a class="btn btn-action btn-action-edit" th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Editar</a>
                            <form th:if="${usuario.activo}" class="d-inline" th:action="@{/usuarios/{id}/desactivar(id=${usuario.id})}" method="post" data-swal-confirm data-swal-action="delete" data-swal-title="¿Desactivar usuario?" data-swal-text="El usuario ya no podrá iniciar sesión.">
                                <button class="btn btn-action btn-action-deactivate" type="submit"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6"/></svg> Desactivar</button>
                            </form>
                            <form th:unless="${usuario.activo}" class="d-inline" th:action="@{/usuarios/{id}/activar(id=${usuario.id})}" method="post">
                                <button class="btn btn-action btn-action-activate" type="submit"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg> Activar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="text-center text-secondary py-5">No hay usuarios registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <footer class="table-footer">
            <span>Mostrando <span th:text="${#lists.size(usuarios)}">0</span> de <span th:text="${#lists.size(usuarios)}">0</span> usuarios</span>
            <div class="pagination-pills">
                <span class="page-pill">‹</span>
                <span class="page-pill active">1</span>
                <span class="page-pill">›</span>
            </div>
        </footer>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
