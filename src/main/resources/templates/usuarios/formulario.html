<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuario')}"></head>
<body class="app-page">
<nav th:replace="~{fragments/layout :: navbar('usuarios')}"></nav>
<main class="app-main">
    <section class="content-card p-4 mx-auto" style="max-width: 720px">
        <h1 class="h3 mb-4" th:text="${usuarioForm.id == null or usuarioForm.id == 0 ? 'Nuevo usuario' : 'Editar usuario'}">Usuario</h1>
        <form th:action="@{/usuarios/guardar}" th:object="${usuarioForm}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3"><label for="username" class="form-label">Nombre de usuario</label><input id="username" class="form-control" th:field="*{username}" required maxlength="80" autocomplete="username"></div>
            <div class="mb-3"><label for="nombre" class="form-label">Nombre completo</label><input id="nombre" class="form-control" th:field="*{nombre}" required maxlength="120"></div>
            <div class="mb-3"><label for="password" class="form-label">Contraseña <span class="text-secondary" th:if="${usuarioForm.id != null and usuarioForm.id != 0}">(dejar en blanco para conservarla)</span></label><input id="password" class="form-control" th:field="*{password}" type="password" th:required="${usuarioForm.id == null or usuarioForm.id == 0}" autocomplete="new-password"></div>
            <div class="mb-3"><label for="rol" class="form-label">Rol</label><select id="rol" class="form-select" th:field="*{rol}" required><option value="">Selecciona un rol</option><option th:each="rol : ${roles}" th:value="${rol.nombre}" th:text="${#strings.replace(rol.nombre, 'ROLE_', '')}"></option></select></div>
            <div class="form-check mb-4"><input id="activo" class="form-check-input" th:field="*{activo}" type="checkbox"><label for="activo" class="form-check-label">Cuenta activa</label></div>
            <div class="d-flex justify-content-end gap-2"><a class="btn btn-outline-light" th:href="@{/usuarios}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar usuario</button></div>
        </form>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
