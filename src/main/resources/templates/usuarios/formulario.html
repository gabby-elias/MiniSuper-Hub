<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuario', 'usuarios-formulario')}"></head>
<body class="app-page user-form-page">
<nav th:replace="~{fragments/layout :: navbar('usuarios')}"></nav>
<main class="app-main">
    <div class="mb-3">
        <a class="btn-back text-decoration-none" th:href="@{/usuarios}">← Volver a usuarios</a>
    </div>
    <section class="user-form-card">
        <h1 th:text="${usuarioForm.id == null or usuarioForm.id == 0 ? 'Nuevo usuario' : 'Editar usuario'}">Nuevo usuario</h1>
        <th:block th:replace="~{fragments/usuario-formulario :: formularioUsuario(false)}"></th:block>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
