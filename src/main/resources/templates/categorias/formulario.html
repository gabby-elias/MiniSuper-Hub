<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categoría', 'categorias-formulario')}"></head>
<body class="app-page">
<nav th:replace="~{fragments/layout :: navbar('categorias')}"></nav>
<main class="app-main">
    <div class="category-form-wrapper">
        <a class="category-form-back" th:href="@{/categorias}">
            ← Volver a categorías
        </a>

        <section class="category-form-card">
            <h1 class="category-form-title" th:text="${categoria.id == 0 ? 'Nueva categoría' : 'Editar categoría'}">Nueva categoría</h1>

            <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post"
                  data-swal-confirm data-swal-action="save"
                  data-swal-title="¿Guardar categoría?"
                  data-swal-text="Confirma para guardar los cambios de la categoría."
                  data-swal-confirm-text="Sí, guardar">
                <input type="hidden" th:field="*{id}">

                <div class="form-field-group">
                    <label for="nombreCategoria" class="form-label-custom">Nombre de la categoría</label>
                    <input id="nombreCategoria" class="form-control-custom" type="text" th:field="*{nombreCategoria}"
                           maxlength="100" placeholder="Ej.: Bebidas, Lácteos, Snacks..." required autofocus>
                </div>

                <div class="category-form-actions">
                    <a class="btn-form-cancel" th:href="@{/categorias}">Cancelar</a>
                    <button class="btn-form-submit" type="submit" th:text="${categoria.id == 0 ? 'Guardar categoría' : 'Guardar cambios'}">
                        Guardar categoría
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
