<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categoría', 'categorias-formulario')}"></head>
<body class="app-page">
<nav th:replace="~{fragments/layout :: navbar('categorias')}"></nav>
<main class="app-main">
    <div class="category-form-wrapper">
        <a class="category-form-back" th:href="@{/categorias}">← Volver a categorías</a>
        <section class="category-form-card">
            <h1 class="category-form-title" th:text="${categoria.id == 0 ? 'Nueva categoría' : 'Editar categoría'}">Nueva categoría</h1>
            <th:block th:replace="~{fragments/categoria-formulario :: formularioCategoria(false)}"></th:block>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
