<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categoría', 'categorias-formulario')}"></head>
<body class="app-page">
<nav th:replace="~{fragments/layout :: navbar('categorias')}"></nav>
<main class="app-main">
    <div class="category-form-wrapper">
        <a class="category-form-back" th:href="@{/categorias}">
            ← Volver a categorías
        </a>

        <section class="category-form-card">
            <header class="category-form-header">
                <h1 th:text="${categoria.id == 0 ? 'Nueva categoría' : 'Editar categoría'}">Categoría</h1>
            </header>

            <form class="category-form-body" th:action="@{/categorias/guardar}" th:object="${categoria}" method="post"
                  data-swal-confirm data-swal-action="save"
                  data-swal-title="¿Guardar categoría?"
                  data-swal-text="Confirma para guardar los cambios de la categoría."
                  data-swal-confirm-text="Sí, guardar">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nombreCategoria" class="form-label">Nombre de la categoría <span class="text-danger">*</span></label>
                    <input id="nombreCategoria" class="form-control" type="text" th:field="*{nombreCategoria}"
                           maxlength="100" placeholder="Nombre de la categoría" required autofocus>
                </div>

                <div class="category-form-actions">
                    <a class="btn btn-outline-secondary" th:href="@{/categorias}">Cancelar</a>
                    <button class="btn btn-submit-category" type="submit">
                        Guardar categoría
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
