<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cliente', 'clientes-formulario')}"></head>
<body class="app-page client-form-page">
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>
<main class="app-main">
    <div class="mb-3">
        <a class="btn-back text-decoration-none" th:href="@{/clientes}">— Volver a clientes</a>
    </div>
    <section class="client-form-card">
        <h1 th:text="${cliente.id == 0 ? 'Nuevo cliente' : 'Editar cliente'}">Nuevo cliente</h1>
        <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" data-swal-confirm data-swal-action="save" data-swal-title="¿Guardar cliente?" data-swal-text="Confirma para guardar los cambios del cliente." data-swal-confirm-text="Sí, guardar">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" class="form-control" type="text" th:field="*{nombre}" placeholder="Nombre del cliente" maxlength="150" required autofocus>
            </div>
            <div class="mb-3">
                <label for="documento" class="form-label">Documento <span class="optional">(opcional)</span></label>
                <input id="documento" class="form-control" type="text" th:field="*{documento}" placeholder="Número de documento" maxlength="50">
            </div>
            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección <span class="optional">(opcional)</span></label>
                <textarea id="direccion" class="form-control" rows="3" th:field="*{direccion}" placeholder="Dirección del cliente" maxlength="255"></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a class="btn btn-secondary" th:href="@{/clientes}">Cancelar</a>
                <button class="btn btn-primary" type="submit">Guardar cliente</button>
            </div>
        </form>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
