<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes', 'clientes-lista')}"></head>
<body class="app-page">
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>
<main class="app-main">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 page-heading">
        <div><h1>Clientes</h1><p th:text="${esAdmin ? 'Administra la información de tus clientes.' : 'Consulta la información de tus clientes.'}">Clientes</p></div>
        <a class="btn btn-primary" th:href="@{/clientes/nuevo}">＋ Nuevo cliente</a>
    </div>
    <section class="content-card table-responsive">
        <table class="table table-hover align-middle">
            <thead><tr><th>ID</th><th>Nombre</th><th>Documento</th><th>Dirección</th><th class="text-end">Acciones</th></tr></thead>
            <tbody>
            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.id}"></td><td th:text="${cliente.nombre}"></td><td th:text="${cliente.documento}"></td><td th:text="${cliente.direccion}"></td>
                <td class="text-end text-nowrap"><th:block th:if="${esAdmin}"><a class="btn btn-sm btn-outline-light" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
                    <form class="d-inline" th:action="@{/clientes/eliminar/{id}(id=${cliente.id})}" method="post" data-swal-confirm data-swal-action="delete" data-swal-title="¿Eliminar cliente?" data-swal-text="Si tiene facturas asociadas, no podrá eliminarse."><button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button></form></th:block>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="5" class="text-center text-secondary py-5">No hay clientes registrados.</td></tr>
            </tbody>
        </table>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
