<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Facturas generadas', 'detalles-factura-lista')}"></head>
<body class="app-page details-page">
<nav th:replace="~{fragments/layout :: navbar('detalles')}"></nav>
<main class="app-main">
    <header class="page-heading details-heading">
        <div>
            <span class="details-eyebrow">VENTAS · REGISTROS</span>
            <h1>Facturas generadas</h1>
            <p>Consulta las facturas registradas y abre el detalle de cada una.</p>
        </div>
    </header>
    <section class="content-card details-table-card table-responsive" aria-label="Facturas generadas">
        <table class="table table-hover align-middle details-table">
            <thead>
            <tr>
                <th>N.º</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Vendedor</th>
                <th>Productos</th>
                <th>Total</th>
                <th class="text-end">Acción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="factura : ${facturas}">
                <td th:text="${factura.id}"></td>
                <td th:text="${factura.fecha != null ? #temporals.format(factura.fecha, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                <td th:text="${factura.cliente != null ? factura.cliente.nombre : 'Consumidor final'}"></td>
                <td th:text="${factura.vendedor != null ? factura.vendedor.nombre : '—'}"></td>
                <td th:text="${factura.detalles != null ? #lists.size(factura.detalles) : 0}"></td>
                <td th:text="|$${#numbers.formatDecimal(factura.total, 1, 2)}|"></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-light"
                       th:href="@{/facturas/ver/{id}(id=${factura.id})}">Ver factura</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(facturas)}">
                <td colspan="7" class="details-empty text-center py-5">
                    <span>No hay facturas registradas.</span>
                    <small>Las facturas generadas aparecerán aquí.</small>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
