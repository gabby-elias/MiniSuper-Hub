<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de factura')}"></head>
<body class="app-page">
<nav th:replace="~{fragments/layout :: navbar('facturas')}"></nav>
<main class="app-main">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 page-heading">
        <div><h1 th:text="|Factura #${factura.id}|">Factura</h1><p>Consulta de la venta y sus productos.</p></div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light" th:href="@{/facturas}">Volver</a>
            <a class="btn btn-success" th:href="@{/facturas/descargar/{id}(id=${factura.id})}">Descargar PDF</a>
            <a th:if="${esAdmin and !factura.anulada}" class="btn btn-primary" th:href="@{/facturas/editar/{id}(id=${factura.id})}">Editar</a>
        </div>
    </div>
    <section class="content-card p-4 mb-3">
        <div class="row g-3">
            <div class="col-md-3"><span class="text-secondary">Fecha</span><div th:text="${factura.fecha != null ? #temporals.format(factura.fecha, 'dd/MM/yyyy HH:mm') : '—'}"></div></div>
            <div class="col-md-3"><span class="text-secondary">Cliente</span><div th:text="${factura.cliente != null ? factura.cliente.nombre : 'Consumidor final'}"></div></div>
            <div class="col-md-3"><span class="text-secondary">Vendedor</span><div th:text="${factura.vendedor != null ? factura.vendedor.nombre : '—'}"></div></div>
            <div class="col-md-3"><span class="text-secondary">Estado</span><div th:text="${factura.anulada ? 'Anulada' : 'Vigente'}"></div></div>
        </div>
    </section>
    <section class="content-card table-responsive">
        <table class="table table-hover align-middle">
            <thead><tr><th>Producto</th><th class="text-end">Cantidad</th><th class="text-end">Precio unitario</th><th class="text-end">Subtotal</th></tr></thead>
            <tbody>
            <tr th:each="detalle : ${factura.detalles}">
                <td th:text="${detalle.producto != null ? detalle.producto.nombre : '—'}"></td>
                <td class="text-end" th:text="${detalle.cantidad}"></td>
                <td class="text-end" th:text="|$${#numbers.formatDecimal(detalle.precioUnitario, 1, 2)}|"></td>
                <td class="text-end" th:text="|$${#numbers.formatDecimal(detalle.subtotal, 1, 2)}|"></td>
            </tr>
            <tr><th colspan="3" class="text-end">Total</th><th class="text-end" th:text="|$${#numbers.formatDecimal(factura.total, 1, 2)}|"></th></tr>
            </tbody>
        </table>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
