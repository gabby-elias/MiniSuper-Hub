<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Facturas', 'facturas-lista')}"></head>
<body class="app-page invoice-list-page">
<nav th:replace="~{fragments/layout :: navbar('facturas')}"></nav>
<main class="app-main">
    <header class="invoice-list-heading">
        <div class="invoice-list-title">
            <span class="invoice-title-icon" aria-hidden="true">▤</span>
            <div>
                <h1>Facturas</h1>
                <p th:text="${esAdmin ? 'Consulta y administra todas las ventas del minisúper.' : 'Consulta y administra tus ventas.'}">Consulta facturas.</p>
            </div>
        </div>
        <a class="btn btn-primary invoice-new-button" th:href="@{/facturas/nuevo}"><span aria-hidden="true">＋</span> Nueva factura</a>
    </header>

    <section class="row g-3 invoice-stat-grid" aria-label="Resumen de facturas">
        <div class="col-6 col-xl-3"><article class="invoice-stat-card invoice-stat-card--blue"><span class="invoice-stat-icon" aria-hidden="true">▤</span><div><span>Total de facturas</span><strong th:text="${totalFacturas}">0</strong></div></article></div>
        <div class="col-6 col-xl-3"><article class="invoice-stat-card invoice-stat-card--green"><span class="invoice-stat-icon" aria-hidden="true">$</span><div><span th:text="${esAdmin ? 'Ventas del día' : 'Mis ventas del día'}">Ventas del día</span><strong th:text="|$${#numbers.formatDecimal(ventasHoy, 1, 2)}|">$0.00</strong></div></article></div>
        <div class="col-6 col-xl-3"><article class="invoice-stat-card invoice-stat-card--amber"><span class="invoice-stat-icon" aria-hidden="true">◷</span><div><span>Pendientes</span><strong th:text="${facturasPendientes}">0</strong></div></article></div>
        <div class="col-6 col-xl-3"><article class="invoice-stat-card invoice-stat-card--red"><span class="invoice-stat-icon" aria-hidden="true">×</span><div><span>Anuladas</span><strong th:text="${facturasAnuladas}">0</strong></div></article></div>
    </section>

    <section class="invoice-table-card">
        <div class="invoice-toolbar">
            <label class="invoice-filter-search">
                <span aria-hidden="true">⌕</span>
                <input type="search" placeholder="Buscar por factura, cliente o vendedor..." aria-label="Buscar facturas" data-table-search>
            </label>
            <label class="invoice-status-filter">
                <span>Estado</span>
                <select aria-label="Filtrar facturas por estado" data-invoice-state>
                    <option value="">Todos los estados</option>
                    <option value="pendiente">Pendientes</option>
                    <option value="entregada">Entregadas</option>
                    <option value="anulada">Anuladas</option>
                </select>
            </label>
        </div>
        <div class="table-responsive">
            <table class="table invoice-list-table align-middle">
                <thead>
                <tr>
                    <th>N.º</th><th>Fecha</th><th>Cliente</th>
                    <th th:if="${esAdmin}">Vendedor</th>
                    <th>Productos</th><th>Total</th><th>Estado</th><th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="factura : ${facturas}" data-invoice-row data-search-row
                    th:attr="data-invoice-status=${factura.anulada ? 'anulada' : (factura.entregada ? 'entregada' : 'pendiente')}">
                    <td class="invoice-id" th:text="${factura.id}"></td>
                    <td th:text="${factura.fecha != null ? #temporals.format(factura.fecha, 'dd/MM/yyyy') : '—'}"></td>
                    <td th:text="${factura.cliente != null ? factura.cliente.nombre : 'Consumidor final'}"></td>
                    <td th:if="${esAdmin}" th:text="${factura.vendedor != null ? factura.vendedor.nombre : '—'}"></td>
                    <td th:text="${factura.detalles != null ? factura.detalles.size() : 0}"></td>
                    <td class="invoice-list-total" th:text="|$${#numbers.formatDecimal(factura.total, 1, 2)}|"></td>
                    <td><span class="badge invoice-state-badge" th:classappend="${factura.anulada ? ' text-bg-danger' : (factura.entregada ? ' text-bg-success' : ' text-bg-warning')}" th:text="${factura.anulada ? 'Anulada' : (factura.entregada ? 'Entregada' : 'Pendiente')}"></span></td>
                    <td>
                        <div class="invoice-row-actions">
                            <a class="btn btn-sm invoice-action-button" th:href="@{/detalles-factura/nuevo(facturaId=${factura.id})}" aria-label="Ver detalle" title="Ver detalle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></a>
                            <form th:if="${!factura.anulada and !factura.entregada}" th:action="@{/facturas/entregar/{id}(id=${factura.id})}" method="post" data-swal-confirm data-swal-action="save" data-swal-title="¿Marcar como entregada?" data-swal-text="La factura dejará de aparecer como pendiente.">
                                <button class="btn btn-sm invoice-action-button invoice-action-button--delivered" type="submit" aria-label="Marcar factura como entregada" title="Marcar entregada"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
                            </form>
                            <a th:if="${!factura.anulada}" class="btn btn-sm invoice-action-button" th:href="@{/facturas/editar/{id}(id=${factura.id})}" aria-label="Editar factura" title="Editar factura"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l4-.8L19.2 8a2.1 2.1 0 0 0-3-3L5 16.2 4 20Z"/></svg></a>
                            <form th:if="${!factura.anulada}" th:action="@{/facturas/anular/{id}(id=${factura.id})}" method="post" data-swal-confirm data-swal-action="delete" data-swal-title="¿Anular factura?" data-swal-text="La factura y sus detalles se conservarán para consulta.">
                                <button class="btn btn-sm invoice-action-button invoice-action-button--void" type="submit" aria-label="Anular factura" title="Anular factura"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m6 18 12-12"/></svg></button>
                            </form>
                            <form th:action="@{/facturas/eliminar/{id}(id=${factura.id})}" method="post" data-swal-confirm data-swal-action="delete" data-swal-title="¿Eliminar factura?" data-swal-text="También se eliminarán sus detalles.">
                                <button class="btn btn-sm invoice-action-button invoice-action-button--delete" type="submit" aria-label="Eliminar factura" title="Eliminar factura"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(facturas)}" class="invoice-empty-row">
                    <td th:colspan="${esAdmin ? 8 : 7}" class="text-center">Todavía no hay facturas registradas.</td>
                </tr>
                <tr data-invoice-no-results hidden class="invoice-empty-row">
                    <td th:colspan="${esAdmin ? 8 : 7}" class="text-center">No hay facturas que coincidan con los filtros.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <footer class="invoice-table-footer">
            <span id="invoiceResultCount" th:attr="data-total=${#lists.size(facturas)}" th:text="|Mostrando ${#lists.size(facturas)} facturas|"></span>
        </footer>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
