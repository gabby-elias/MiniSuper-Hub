<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión', 'login')}"></head>
<body class="login-page d-flex align-items-center justify-content-center p-3">
<main class="card login-card">
    <div class="card-body p-4 p-md-5">
        <header class="text-center mb-4 login-header">
            <div class="fs-1 mb-2" aria-hidden="true">🛒</div>
            <h1 class="h3 fw-bold mb-1">Minisúper</h1>
            <p class="text-secondary mb-0">Inicia sesión para continuar</p>
        </header>

        <div class="alert login-alert login-alert--error" role="alert" th:if="${loginError}">Usuario o contraseña incorrectos.</div>
        <div class="alert login-alert login-alert--success" role="status" th:if="${logout}">Sesión cerrada correctamente.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <div class="login-input-wrap">
                    <span class="login-input-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
                    <input id="username" name="username" type="text" class="form-control form-control-lg" autocomplete="username" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <div class="login-input-wrap">
                    <span class="login-input-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg></span>
                    <input id="password" name="password" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
                </div>
            </div>
            <button id="login-submit" class="btn btn-primary btn-lg w-100" type="submit">Iniciar sesión</button>
        </form>
    </div>
</main>
</body>
</html>
