<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión', 'login')}"></head>
<body class="login-page">
<main class="card login-card">
    <div class="card-body login-card-body">
        <header class="login-header">
            <div class="login-brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.4L22 8H7"/><circle cx="10" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg>
            </div>
            <h1>Minisúper</h1>
            <p>Ingresa tus credenciales para continuar</p>
        </header>

        <div class="alert login-alert login-alert--error" role="alert" th:if="${loginError}">Usuario o contraseña incorrectos.</div>
        <div class="alert login-alert login-alert--success" role="status" th:if="${logout}">Sesión cerrada correctamente.</div>

        <form th:action="@{/login}" method="post">
            <div class="login-field">
                <label for="username" class="form-label">Usuario</label>
                <div class="login-input-wrap">
                    <span class="login-input-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
                    <input id="username" name="username" type="text" class="form-control" autocomplete="username" required autofocus>
                </div>
            </div>
            <div class="login-field">
                <label for="password" class="form-label">Contraseña</label>
                <div class="login-input-wrap">
                    <span class="login-input-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg></span>
                    <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                    <button class="login-password-toggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false" data-password-toggle>
                        <svg class="login-eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="login-options">
                <label class="login-remember" for="remember-me"><input id="remember-me" type="checkbox"><span>Mantener sesión iniciada</span></label>
                <span class="login-forgot">¿Olvidaste tu contraseña?</span>
            </div>
            <button id="login-submit" class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
        </form>

        <p class="login-security-note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 6v5c0 4.5-2.9 7.7-7 10-4.1-2.3-7-5.5-7-10V6l7-3Z"/><path d="m9.5 12 1.7 1.7 3.5-3.5"/></svg>
            <span>Tus credenciales están protegidas</span>
        </p>
    </div>
</main>
<script th:src="@{/js/login.js}" defer></script>
</body>
</html>
