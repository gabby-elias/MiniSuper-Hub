<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Producto', 'productos-formulario')}"></head>
<body class="app-page">
<nav th:replace="~{fragments/layout :: navbar('productos')}"></nav>
<main class="app-main">
    <div class="mb-3"><a class="text-decoration-none" th:href="@{/productos}">← Volver a productos</a></div>
    <section class="content-card mx-auto p-4" style="max-width:720px">
        <h1 class="h4 fw-bold mb-4" th:text="${producto.id == 0 ? 'Nuevo producto' : 'Editar producto'}"></h1>
        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" data-swal-confirm data-swal-action="save" data-swal-title="¿Guardar producto?" data-swal-text="Confirma para guardar los datos y existencias del producto." data-swal-confirm-text="Sí, guardar">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3"><label for="nombre" class="form-label">Nombre del producto</label><input id="nombre" class="form-control" type="text" th:field="*{nombre}" maxlength="150" required autofocus></div>
            <div class="mb-3"><label for="unidadMedida" class="form-label">Unidad de medida</label><input id="unidadMedida" class="form-control" type="text" th:field="*{unidadMedida}" maxlength="50" placeholder="Ej.: unidad, kg, litro"></div>
            <div class="row g-3">
                <div class="col-md-6"><label for="stock" class="form-label">Existencias</label><input id="stock" class="form-control" type="number" min="0" step="1" th:field="*{stock}" required></div>
                <div class="col-md-6"><label for="precioVenta" class="form-label">Precio de venta</label><div class="input-group"><span class="input-group-text">$</span><input id="precioVenta" class="form-control" type="number" step="0.01" min="0" th:field="*{precioVenta}" required></div></div>
            </div>
            <div class="mb-3 mt-3"><label for="categoria" class="form-label">Categoría</label><select id="categoria" name="categoria.id" class="form-select" required><option value="">Selecciona una categoría</option><option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nombreCategoria}" th:selected="${producto.categoria != null and producto.categoria.id == categoria.id}"></option></select><div class="form-text" th:if="${#lists.isEmpty(categorias)}">Primero registra una categoría.</div></div>
            <div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-light" th:href="@{/productos}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar producto</button></div>
        </form>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
