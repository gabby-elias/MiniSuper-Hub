<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Producto', 'productos-formulario')}"></head>
<body class="app-page">
<nav th:replace="~{fragments/layout :: navbar('productos')}"></nav>
<main class="app-main">
    <div class="product-form-wrapper">
        <a class="product-form-back" th:href="@{/productos}">← Volver a productos</a>
        <section class="product-form-card">
            <h1 class="product-form-title" th:text="${producto.id == 0 ? 'Nuevo producto' : 'Editar producto'}">Nuevo producto</h1>
            <th:block th:replace="~{fragments/producto-formulario :: formularioProducto(false)}"></th:block>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/product-form.js(v=13)}"></script>
</body>
</html>
