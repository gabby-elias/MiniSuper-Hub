<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Producto', 'productos-formulario')}"></head>
<body class="app-page">
<nav th:replace="~{fragments/layout :: navbar('productos')}"></nav>
<main class="app-main">
    <div class="product-form-wrapper">
        <a class="product-form-back" th:href="@{/productos}">
            ← Volver al catálogo de productos
        </a>

        <section class="product-form-card">
            <header class="product-form-header">
                <h1 th:text="${producto.id == 0 ? 'Nuevo producto' : 'Editar producto'}">Producto</h1>
            </header>

            <form class="product-form-body" th:action="@{/productos/guardar}" th:object="${producto}" method="post"
                  data-swal-confirm data-swal-action="save"
                  data-swal-title="¿Guardar producto?"
                  data-swal-text="Confirma para guardar los datos y existencias del producto."
                  data-swal-confirm-text="Sí, guardar">
                <input type="hidden" th:field="*{id}">

                <div class="product-form-section-title">
                    Información General
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-7">
                        <label for="nombre" class="form-label">Nombre del producto <span class="required-star">*</span></label>
                        <input id="nombre" class="form-control" type="text" th:field="*{nombre}" maxlength="150"
                               placeholder="Nombre del producto" required autofocus>
                    </div>
                    <div class="col-md-5">
                        <label for="categoria" class="form-label">Categoría <span class="required-star">*</span></label>
                        <select id="categoria" name="categoria.id" class="form-select" required>
                            <option value="">Selecciona una categoría</option>
                            <option th:each="categoria : ${categorias}"
                                    th:value="${categoria.id}"
                                    th:text="${categoria.nombreCategoria}"
                                    th:selected="${producto.categoria != null and producto.categoria.id == categoria.id}">
                            </option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#lists.isEmpty(categorias)}">
                            Primero debes registrar al menos una categoría.
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="unidadMedida" class="form-label">Unidad de medida</label>
                    <input id="unidadMedida" class="form-control" type="text" th:field="*{unidadMedida}" maxlength="50"
                           placeholder="Ej.: Unidad, Litro, Libra, Kilogramo...">
                    <div class="unit-quick-picks" aria-label="Sugerencias de unidad">
                        <span class="text-secondary small me-1 align-self-center">Sugerencias:</span>
                        <button type="button" class="unit-tag-btn" onclick="setUnidad('Unidad')">Unidad</button>
                        <button type="button" class="unit-tag-btn" onclick="setUnidad('Libra')">Libra</button>
                        <button type="button" class="unit-tag-btn" onclick="setUnidad('Kilogramo')">Kilogramo</button>
                        <button type="button" class="unit-tag-btn" onclick="setUnidad('Litro')">Litro</button>
                        <button type="button" class="unit-tag-btn" onclick="setUnidad('Bolsa')">Bolsa</button>
                        <button type="button" class="unit-tag-btn" onclick="setUnidad('Caja')">Caja</button>
                        <button type="button" class="unit-tag-btn" onclick="setUnidad('Lata')">Lata</button>
                    </div>
                </div>

                <div class="product-form-section-title">
                    Inventario y Precios
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="stock" class="form-label">Existencias (Stock) <span class="required-star">*</span></label>
                        <input id="stock" class="form-control" type="number" min="0" step="1" th:field="*{stock}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="precioVenta" class="form-label">Precio de venta <span class="required-star">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text fw-bold">$</span>
                            <input id="precioVenta" class="form-control fw-semibold" type="number" step="0.01" min="0" th:field="*{precioVenta}" placeholder="0.00" required>
                        </div>
                    </div>
                </div>

                <div class="product-form-actions">
                    <a class="btn btn-outline-secondary" th:href="@{/productos}">Cancelar</a>
                    <button class="btn btn-submit-product" type="submit">
                        Guardar producto
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    function setUnidad(val) {
        const input = document.getElementById('unidadMedida');
        if (input) {
            input.value = val;
            input.focus();
        }
    }
</script>
</body>
</html>
