<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Producto', 'productos-formulario')}"></head>
<body class="app-page">
<nav th:replace="~{fragments/layout :: navbar('productos')}"></nav>
<main class="app-main">
    <div class="product-form-wrapper">
        <a class="product-form-back" th:href="@{/productos}">
            ← Volver a productos
        </a>

        <section class="product-form-card">
            <h1 class="product-form-title" th:text="${producto.id == 0 ? 'Nuevo producto' : 'Editar producto'}">Nuevo producto</h1>

            <form th:action="@{/productos/guardar}" th:object="${producto}" method="post"
                  data-swal-confirm data-swal-action="save"
                  data-swal-title="¿Guardar producto?"
                  data-swal-text="Confirma para guardar los datos y existencias del producto."
                  data-swal-confirm-text="Sí, guardar">
                <input type="hidden" th:field="*{id}">

                <!-- 1. Nombre del producto -->
                <div class="form-field-group">
                    <label for="nombre" class="form-label-custom">Nombre del producto</label>
                    <input id="nombre" class="form-control-custom" type="text" th:field="*{nombre}" maxlength="150"
                           placeholder="Ej.: Coca Cola 600 ml" required autofocus>
                </div>

                <!-- 2. Unidad de medida -->
                <div class="form-field-group">
                    <label for="unidadMedida" class="form-label-custom">Unidad de medida</label>
                    <input id="unidadMedida" class="form-control-custom" type="text" th:field="*{unidadMedida}" maxlength="50"
                           placeholder="Ej.: unidad, kg, litro">
                </div>

                <!-- 3. Fila Existencias y Precio de venta -->
                <div class="row g-3 mb-3">
                    <!-- Existencias con Stepper y Agregar rápido -->
                    <div class="col-12 col-md-6">
                        <label for="stock" class="form-label-custom">Existencias</label>
                        <div class="stock-stepper-box">
                            <button type="button" class="stepper-btn" id="btnStockMinus" aria-label="Disminuir existencias">−</button>
                            <input id="stock" class="stepper-input" type="number" min="0" step="1" th:field="*{stock}" required>
                            <button type="button" class="stepper-btn" id="btnStockPlus" aria-label="Aumentar existencias">+</button>
                        </div>
                        <div class="quick-add-container">
                            <span class="quick-add-label">Agregar rápido:</span>
                            <button type="button" class="quick-add-pill" data-add="5">+5</button>
                            <button type="button" class="quick-add-pill" data-add="10">+10</button>
                            <button type="button" class="quick-add-pill" data-add="20">+20</button>
                        </div>
                    </div>

                    <!-- Precio de venta -->
                    <div class="col-12 col-md-6">
                        <label for="precioVenta" class="form-label-custom">Precio de venta</label>
                        <div class="price-input-group">
                            <span class="price-prefix">$</span>
                            <input id="precioVenta" class="price-input" type="number" step="0.01" min="0"
                                   th:field="*{precioVenta}" placeholder="0.00" required>
                        </div>
                    </div>
                </div>

                <!-- 4. Categoría -->
                <div class="form-field-group">
                    <label for="categoria" class="form-label-custom">Categoría</label>
                    <select id="categoria" name="categoria.id" class="form-select-custom" required>
                        <option value="">Selecciona una categoría</option>
                        <option th:each="categoria : ${categorias}"
                                th:value="${categoria.id}"
                                th:text="${categoria.nombreCategoria}"
                                th:selected="${producto.categoria != null and producto.categoria.id == categoria.id}">
                        </option>
                    </select>
                    <div class="text-danger small mt-1" th:if="${#lists.isEmpty(categorias)}">
                        Primero debes registrar al menos una categoría.
                    </div>
                </div>

                <!-- 5. Acciones: Cancelar y Guardar producto -->
                <div class="product-form-actions">
                    <a class="btn-form-cancel" th:href="@{/productos}">Cancelar</a>
                    <button class="btn-form-submit" type="submit" th:text="${producto.id == 0 ? 'Guardar producto' : 'Guardar cambios'}">
                        Guardar producto
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    (() => {
        const stockInput = document.getElementById('stock');
        const btnMinus = document.getElementById('btnStockMinus');
        const btnPlus = document.getElementById('btnStockPlus');
        const quickAddBtns = document.querySelectorAll('.quick-add-pill');

        if (stockInput) {
            // Asegurar valor numérico inicial
            if (!stockInput.value) {
                stockInput.value = '0';
            }

            btnMinus?.addEventListener('click', () => {
                let current = parseInt(stockInput.value, 10) || 0;
                if (current > 0) {
                    stockInput.value = current - 1;
                    stockInput.dispatchEvent(new Event('input'));
                }
            });

            btnPlus?.addEventListener('click', () => {
                let current = parseInt(stockInput.value, 10) || 0;
                stockInput.value = current + 1;
                stockInput.dispatchEvent(new Event('input'));
            });

            quickAddBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const addAmount = parseInt(btn.getAttribute('data-add'), 10) || 0;
                    let current = parseInt(stockInput.value, 10) || 0;
                    stockInput.value = current + addAmount;
                    stockInput.dispatchEvent(new Event('input'));
                });
            });
        }
    })();
</script>
</body>
</html>
