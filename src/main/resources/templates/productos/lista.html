<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body class="app-page">
<nav th:replace="~{fragments/layout :: navbar('productos')}"></nav>
<main class="app-main">
    <section class="row g-3 mb-3" aria-label="Resumen de productos">
        <div class="col-12 col-md-4">
            <div class="card stat-card h-100"><div class="card-body">
                <div class="text-secondary mb-1" th:text="${esAdmin ? 'Ventas de hoy' : 'Mis ventas de hoy'}">Ventas de hoy</div>
                <div class="h2 mb-0 stat-value-green" th:text="|$${#numbers.formatDecimal(ventasHoy, 1, 2)}|">$0.00</div>
            </div></div>
        </div>
        <div class="col-6 col-md-4">
            <div class="card stat-card h-100"><div class="card-body">
                <div class="text-secondary mb-1">Productos</div>
                <div class="h2 mb-0" th:text="${cantidadProductos}">0</div>
            </div></div>
        </div>
        <div class="col-6 col-md-4">
            <div class="card stat-card h-100"><div class="card-body">
                <div class="text-secondary mb-1">Stock bajo</div>
                <div class="h2 mb-0 stat-value-warning" th:text="${cantidadStockBajo}">0</div>
            </div></div>
        </div>
    </section>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 page-heading">
        <div><h1>Productos</h1><p th:text="${esAdmin ? 'Administra el catálogo, las existencias y los precios.' : 'Consulta los productos y sus precios.'}">Productos</p></div>
        <a th:if="${esAdmin}" class="btn btn-primary" th:href="@{/productos/nuevo}">＋ Nuevo producto</a>
    </div>
    <section class="content-card table-responsive">
        <table class="table table-hover align-middle">
            <thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Estado</th><th th:if="${esAdmin}" class="text-end">Acciones</th></tr></thead>
            <tbody>
            <tr th:each="producto : ${productos}">
                <td th:text="${producto.nombre}"></td>
                <td th:text="${producto.categoria != null ? producto.categoria.nombreCategoria : '—'}"></td>
                <td th:text="|$${#numbers.formatDecimal(producto.precioVenta, 1, 2)}|"></td>
                <td>
                    <span class="stock-badge" th:classappend="${producto.stock == 0 ? ' stock-empty' : (producto.stock <= 5 ? ' stock-low</h1>' : ' stock-available')}"
                          th:title="|Existencias: ${producto.stock}|"
                          th:text="${producto.stock == 0 ? 'Agotado' : (producto.stock <= 5 ? 'Stock bajo' : 'Disponible')}">Disponible</span>
                </td>
                <td th:if="${esAdmin}" class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-light" th:href="@{/productos/editar/{id}(id=${producto.id})}">Editar</a>
                    <form class="d-inline" th:action="@{/productos/eliminar/{id}(id=${producto.id})}" method="post" data-swal-confirm data-swal-action="delete" data-swal-title="¿Eliminar producto?" data-swal-text="Los detalles de factura podrían impedir su eliminación.">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos)}"><td th:colspan="${esAdmin ? 5 : 4}" class="text-center text-secondary py-5">No hay productos registrados.</td></tr>
            </tbody>
        </table>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
