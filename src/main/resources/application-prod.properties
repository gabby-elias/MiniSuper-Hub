# Production settings for external servlet containers and containerized deployments.
# Supply these values through the Windows service environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Validate, but never change, the production schema at application startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Demo account creation also runs a legacy schema migration; keep it disabled in production.
app.demo.initialize-users=false
