# Nombre de la aplicación
spring.application.name=MiniSuper-Hub

# Abrir la aplicación en el navegador predeterminado al iniciar el servidor.
app.browser.auto-open=true
# Conexión a Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/MiniSuper-Hub
spring.datasource.username=postgres
spring.datasource.password=admin

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Formato JSON y Zona Horaria
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/El_Salvador

# Credenciales de demostración; cambiar antes de desplegar.
app.demo.admin.username=admin
app.demo.admin.password=admin
app.demo.employee.username=empleado
app.demo.employee.password=empleado
# Carga única del catálogo inicial; desactivar en producción.
app.catalogo.productos.enabled=true

# Datos que aparecen en las facturas PDF; reemplazar por los del minisúper.
app.minisuper.nombre=Minis\u00FAper
app.minisuper.direccion=Direcci\u00F3n del minis\u00FAper
app.minisuper.telefono=2373-0000

springdoc.packages-to-scan=com.umoar.minisuperhub.controladores.api
