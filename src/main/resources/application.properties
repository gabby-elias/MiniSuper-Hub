# Nombre de la aplicación
spring.application.name=MiniSuper-Hub
# Conexión a Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/MiniSuper-Hub
spring.datasource.username=postgres
spring.datasource.password=admid

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Formato JSON y Zona Horaria
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/El_Salvador

# Credenciales de demostración; cambiar antes de desplegar.
app.demo.admin.username=admin
app.demo.admin.password=admin
app.demo.employee.username=empleado
app.demo.employee.password=empleado

# Datos que aparecen en las facturas PDF; reemplazar por los del minisúper.
app.minisuper.nombre=Minisúper
app.minisuper.direccion=Dirección del minisúper
app.minisuper.telefono=0000-0000

